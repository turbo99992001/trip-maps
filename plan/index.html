<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2933;--mut:#66788a;--line:#e3e8ee;--pri:#1565c0;--spot:#1e88e5;--rest:#ef6c00;--lodge:#d32f2f;--fest:#8e24aa;--ok:#2e7d32}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
header{position:sticky;top:0;z-index:1000;background:#0d47a1;color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:700}
.rsw{display:flex;gap:4px}.rsw button{border:1px solid #90caf9;background:transparent;color:#fff;border-radius:16px;padding:4px 12px;font-size:14px;cursor:pointer}
.rsw button.on{background:#fff;color:#0d47a1;font-weight:700}
#rname{font-size:12px;opacity:.85;flex:1 1 200px}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;font-size:14px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:700}
main{display:grid;grid-template-columns:minmax(360px,44%) 1fr;height:calc(100vh - 52px)}
#left{overflow:auto;border-right:1px solid var(--line)}#mapwrap{position:relative}#map{position:absolute;inset:0}
.panel{display:none;padding:10px}.panel.on{display:block}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.filters input[type=search],.filters select{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
.filters label{font-size:13px;display:flex;align-items:center;gap:4px}
.addto{display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0 8px;flex-wrap:wrap}
.addto select{padding:5px;border-radius:6px;border:1px solid var(--line)}
.cnt{font-size:12px;color:var(--mut);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.card h3{margin:0 0 4px;font-size:15px;cursor:pointer;color:#0b3d91}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.tag{font-size:11px;padding:1px 7px;border-radius:10px;background:#eef2f7;color:#425466}
.tag.rain{background:#e3f2fd;color:#0d47a1}.tag.rest{background:#fff3e0;color:#e65100}.tag.fest{background:#f3e5f5;color:#6a1b9a}.tag.ded{background:#e8f5e9;color:#1b5e20}.tag.near{background:#fffde7;color:#795548}
.desc{font-size:13px;color:#3e4c59;margin:4px 0}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn{border:1px solid var(--pri);color:var(--pri);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btn.pri{background:var(--pri);color:#fff}.btn.sm{padding:3px 8px;font-size:12px}.btn.warn{border-color:#c62828;color:#c62828}
.nav{border:1px dashed var(--line);border-radius:8px;padding:8px;margin-top:8px;background:#fbfcfd}
.nav h4{margin:0 0 6px;font-size:13px}.nav .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0}
.mc{font-family:ui-monospace,Menlo,monospace;background:#f1f3f5;padding:2px 6px;border-radius:6px;font-size:13px}
.todo{color:#c62828;font-weight:700}
.pk{border-top:1px solid var(--line);padding-top:6px;margin-top:6px}.pk:first-of-type{border-top:0;margin-top:0;padding-top:0}
.pkmeta{font-size:12px;color:var(--mut)}

.dayhead{font-size:13px;color:var(--mut);margin:4px 0 8px}

.drive{font-size:12px;color:#455a64;margin:2px 0 6px 32px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

#modal .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:24px;cursor:pointer}

.src a{font-size:12px;word-break:break-all;display:block}

.legend{position:absolute;z-index:500;right:8px;top:8px;background:#fff;border-radius:8px;padding:6px 8px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.2)}

 .filters{grid-template-columns:1fr}header h1{font-size:15px}}

/* ---------- normalize restaurants ---------- */
function normPk(p){
 if(!p) return null; const o=Object.assign({},p);
 if(o.capacity==null&&o.spaces!=null) o.capacity=o.spaces;
 if(!o.type){ if(o.is_own===true) o.type="dedicated"; else if(o.is_own===false) o.type="nearby"; }

/* ---------- itinerary ---------- */
const MEAL_ORDER={breakfast:0,lunch:1,snack:2,cafe:2,dinner:3};
function mealOf(it){if(it.meal) return it.meal; const r=it.type==="restaurant"?RS[it.id]:null; const m=r&&[].concat(r.meal||[]); return m&&m.length===1?m[0]:null;}
function mergeByMeal(arr,items){
 arr=arr.slice();
 (items||[]).forEach(x=>{ if(!x||!x.id) return; const it={type:x.type||"restaurant",id:String(x.id)}; if(x.meal) it.meal=x.meal;
  if(it.type==="restaurant"&&!RS[it.id]) return;

  const m=it.meal; const spots=arr.filter(y=>y.type!=="restaurant").length;
  const idxOfMeal=k=>{let i=-1; arr.forEach((y,j)=>{if(y.type==="restaurant"&&mealOf(y)===k) i=j;}); return i;};
  if(m==="breakfast"){arr.unshift(it);return;}
  if(m==="dinner"){arr.push(it);return;}
  if(m==="snack"||m==="cafe"){const li=idxOfMeal("lunch"); if(li>=0){arr.splice(li+1,0,it);return;}}

const FOOD_KEY="tokyo2027_food_itinerary_v1", FOOD_SIG="tokyo2027_food_merged_sig";
function mergeFoodOnce(){

  const base=all[r]||suggested(r);

}
