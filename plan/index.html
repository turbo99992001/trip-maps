function pkKey(p){const m=String((p.source||"")+" "+(p.note||"")+" "+(p.name||"")).match(/(way|node|relation)\/(\d+)/); if(m) return m[1]+"/"+m[2]; if(p.lat!=null&&p.lng!=null) return (+p.lat).toFixed(4)+","+(+p.lng).toFixed(4); return "n:"+(p.name||"");}
function mergedParkings(list){const seen=new Set(), out=[]; list.forEach(p=>{ if(!p) return; const k=p.exists===false?"none":pkKey(p); if(seen.has(k)) return; seen.add(k); out.push(p);});
 const real=out.filter(p=>p.exists!==false); return real.length?real:out;}
const MEAL_ORDER={breakfast:0,lunch:1,snack:2,cafe:2,dinner:3};
function mealOf(it){if(it.meal) return it.meal; const r=it.type==="restaurant"?RS[it.id]:null; const m=r&&[].concat(r.meal||[]); return m&&m.length===1?m[0]:null;}
function mergeByMeal(arr,items){
 arr=arr.slice(); const pending=[];
 const at=id=>arr.findIndex(y=>y.id===id);
 const afterGroup=i=>{let j=i+1; const mid=arr[i].id; while(j<arr.length&&arr[j].type==="restaurant"&&sameOf(arr[j])===mid) j++; return j;};
 const place=(it,x,last)=>{
  const t=sameOf(it);
  if(t){const i=at(t); if(i>=0&&arr[i].type==="spot"){arr.splice(afterGroup(i),0,it); return true;}}
  if(x.insert_after){const i=at(x.insert_after); if(i>=0){arr.splice(afterGroup(i),0,it); return true;} if(!last) return false;}
  if(x.insert_before){const i=at(x.insert_before); if(i>=0){arr.splice(i,0,it); return true;} if(!last) return false;}
  const m=it.meal; const spots=arr.filter(y=>y.type!=="restaurant").length;
  const idxOfMeal=k=>{let i=-1; arr.forEach((y,j)=>{if(y.type==="restaurant"&&mealOf(y)===k) i=j;}); return i;};
  let pos=-1;
  if(m==="breakfast") pos=0;
  else if(m==="dinner") pos=arr.length;
  else if((m==="snack"||m==="cafe")&&idxOfMeal("lunch")>=0) pos=afterGroup(idxOfMeal("lunch"));
  else if(m==="lunch"&&idxOfMeal("snack")>=0) pos=idxOfMeal("snack");
  if(pos<0){ let cnt=0; pos=arr.length; const half=Math.ceil(spots/2);
   if(half===0){pos=arr.findIndex(y=>y.type==="restaurant"&&mealOf(y)==="dinner"); if(pos<0) pos=arr.length;}
   else for(let j=0;j<arr.length;j++){ if(arr[j].type!=="restaurant"){cnt++; if(cnt===half){pos=j+1; while(pos<arr.length&&arr[pos].type==="restaurant"&&(sameOf(arr[pos])===arr[j].id||MEAL_ORDER[mealOf(arr[pos])]<=MEAL_ORDER[m||"lunch"])) pos++; break;}} } }
  if(it.time){ // 有建議時間：與其他有時間的項目保持時間先後
   for(let j=0;j<pos;j++){ if(arr[j].time&&arr[j].time>it.time){pos=j; break;} }
   for(let j=arr.length-1;j>=pos;j--){ if(arr[j].time&&arr[j].time<it.time){pos=j+1; break;} }
   while(pos>0&&pos<arr.length&&sameOf(arr[pos])&&arr.slice(0,pos).some(y=>y.id===sameOf(arr[pos]))) pos++;
  }
  arr.splice(pos,0,it); return true;
 };
 (items||[]).forEach(x=>{ if(!x||!x.id) return; const it={type:x.type||"restaurant",id:String(x.id)}; if(x.meal) it.meal=x.meal; if(x.time) it.time=String(x.time).slice(0,5); if(x.same_stop_as) it.same_stop_as=String(x.same_stop_as);
  if(it.type==="restaurant"&&!RS[it.id]) return;
  if(arr.some(y=>y.type===it.type&&y.id===it.id)) return;
  if(!place(it,x,false)) pending.push([it,x]); });
 pending.forEach(([it,x])=>{ if(!arr.some(y=>y.type===it.type&&y.id===it.id)) place(it,x,true); });
 // 最後一輪：沒有錨點、只有建議時間的餐廳，依時間與其他有時間的項目排先後（例：D Day7 09:40 朝ラー 在 12:45 午餐之前）
 const src={}; (items||[]).forEach(x=>{if(x&&x.id) src[String(x.id)]=x;});
 arr.filter(y=>y.type==="restaurant"&&y.time&&src[y.id]&&!src[y.id].insert_after&&!src[y.id].insert_before).forEach(y=>{
  const t=sameOf(y); if(t){const k=at(t); if(k>=0&&arr[k].type==="spot") return;}
  const i=at(y.id); let pos=i;
  for(let j=0;j<i;j++){ if(arr[j].time&&arr[j].time>y.time){pos=j; break;} }
  if(pos===i) for(let j=arr.length-1;j>i;j--){ if(arr[j].time&&arr[j].time<y.time){pos=afterGroup(j); break;} }
  if(pos===i) return;
  if(pos<arr.length){const t2=sameOf(arr[pos]); const k=t2?at(t2):-1; if(k>=0&&k<pos) pos=k;}
  arr.splice(i,1); if(pos>i) pos--; arr.splice(pos,0,y); });
 return arr;
}
function suggested(r){
 const out={}; const days=D.plan.routes[r].days;
 days.forEach(d=>{out[d.day]=d.items.map(x=>x.type==="restaurant"?Object.assign({type:"restaurant",id:x.id},x.meal?{meal:x.meal}:{}):({type:"spot",id:x.id}));});
 if(RPLAN&&Array.isArray(RPLAN[r])) RPLAN[r].forEach(dd=>{ if(out[dd.day]) out[dd.day]=mergeByMeal(out[dd.day],dd.items); });
 return out;
}
function mergeFoodOnce(){
 const L=D.meta.legacy_storage; if(!L||!L.food) return 0;
 const raw=ls.get(L.food); if(!raw) return 0;
 let food; try{food=JSON.parse(raw);}catch(e){return 0;} if(!food||typeof food!=="object") return 0;
 const sig=String(raw.length)+":"+Array.from(raw).reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7);
 if(ls.get(K.foodsig)===sig) return 0;
 const all=store(); let n=0;
 for(const r of Object.keys(food)){ if(!D.plan.routes[r]||typeof food[r]!=="object") continue;
  const base=all[r]||suggested(r);
  for(const d of Object.keys(food[r])){ if(!Array.isArray(food[r][d])) continue; const before=(base[d]||[]).length; base[d]=mergeByMeal(base[d]||[],food[r][d].filter(x=>x&&(x.type||"restaurant")==="restaurant")); n+=base[d].length-before; }
  all[r]=base; }
 ls.set(K.it,JSON.stringify(all)); ls.set(K.foodsig,sig); return n;
}
function itin(r){const s=store(); return (s[r]&&typeof s[r]==="object")?s[r]:suggested(r);}
function saveDay(r,day,arr){const s=store(); if(!s[r]) s[r]=suggested(r); s[r][day]=arr; ls.set(K.it,JSON.stringify(s));}
function dayInfo(r,day){return D.plan.routes[r].days.find(d=>d.day===+day);}
function addTo(type,id,day,extra){
 day=+day||curDay; const it=Object.assign({type,id},extra||{}); const near=!!it.insertNear; delete it.insertNear;
 const o=get(it)||(SP&&SP[id])||(typeof RS!=="undefined"&&RS[id])||null;
 if(near&&typeof insertNear==="function"&&o&&o.lat!=null) insertNear(day,it,+o.lat,+o.lng);
 else { const arr=(itin(route)[day]||[]).slice(); arr.push(it); saveDay(route,day,arr); }
 renderItin(); if(typeof renderMarkers==="function") renderMarkers();
 const di=dayInfo(route,day); toast("已加入 Day "+day+"（"+di.date.slice(5).replace("-","/")+"）");
}

function flatStop(x,mergedKey){ // 一站 → [主項目, 同一站餐廳…]
 const main=normItem(x); if(!main) return []; const out=[main];

function parseImport0(j){
 if(!j||typeof j!=="object") return null;
 if(j.schema==="agency.itinerary.v0"&&Array.isArray(j.days)){
  const r=j.trip&&j.trip.route_key; const o={}, n={};
  j.days.forEach(d=>{o[d.day]=[].concat(...(d.items||[]).filter(x=>["spot","restaurant","custom"].includes(x.kind)).map(x=>flatStop(x,"merged_items"))); if(d.notes) n[d.day]=d.notes;});
  return {trip:j.trip&&j.trip.id,routes:{[r]:o},notes:{[r]:n}};
 }
 if(j.schema==="agency.final.v0"){
  const r=j.route; const o={}, n={};
  if(Array.isArray(j.days)) j.days.forEach(d=>{o[d.day]=[].concat(...(d.items||[]).map(x=>flatStop(x,"merged"))); if(d.note) n[d.day]=d.note;});
  else if(j.itinerary) Object.keys(j.itinerary).forEach(k=>o[k]=(j.itinerary[k]||[]).map(x=>normItem(x)).filter(Boolean));
  return {trip:j.trip_id,routes:{[r]:o},notes:{[r]:n}};
 }
 const it=j.itinerary||j; const routes={};
 for(const r of Object.keys(it)){ if(!it[r]||typeof it[r]!=="object"||Array.isArray(it[r])) continue; const o={}; let ok=false;
  for(const d of Object.keys(it[r])){ if(Array.isArray(it[r][d])){o[d]=it[r][d].map(x=>normItem(x)).filter(Boolean); ok=true;} } if(ok) routes[r]=o; }

}
function doImport(p){

  if(!D.plan.routes[r]){ if(p.legacy) continue; if(!confirm("檔案的路線「"+r0+"」不在這個行程的路線清單（"+Object.keys(D.plan.routes).join("/")+"）。\n要匯入到目前路線 "+route+" 嗎？")) continue; r=route; }

  s[r]=o; nr++; done.push(r);

 }

  const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height); if(bmp.close) bmp.close();
  const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.82)); if(!b||b.size>=f.size) return f;
  return new File([b],f.name.replace(/\.(png|webp|jpe?g)$/i,"")+".jpg",{type:"image/jpeg"}); }catch(e){ return f; } }
