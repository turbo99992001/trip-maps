<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2933;--mut:#66788a;--line:#e3e8ee;--pri:#1565c0;--spot:#1e88e5;--rest:#ef6c00;--lodge:#d32f2f;--fest:#8e24aa;--ok:#2e7d32;--hh:56px}
*{box-sizing:border-box}html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
html{overflow-x:hidden}body{overflow-x:hidden;min-height:100vh}
header{position:sticky;top:0;z-index:1000;background:#0d47a1;color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:16px;margin:0 4px 0 0;font-weight:700;white-space:nowrap}
header a.home{color:#fff;text-decoration:none;font-size:20px;line-height:1}
header select{max-width:100%;padding:6px 8px;border-radius:8px;border:1px solid #90caf9;background:#0b3d91;color:#fff;font-size:14px}
#tripSel{max-width:320px}
.rsw{display:flex;gap:4px;flex-wrap:wrap}.rsw button{border:1px solid #90caf9;background:transparent;color:#fff;border-radius:16px;padding:4px 12px;font-size:14px;cursor:pointer}
.rsw button.on{background:#fff;color:#0d47a1;font-weight:700}
#routeSel{display:none}
#rname{font-size:12px;opacity:.85;flex:1 1 200px;min-width:0}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;font-size:14px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:700}
main{display:grid;grid-template-columns:minmax(360px,44%) 1fr;height:calc(100vh - var(--hh))}
main[hidden],#bnav[hidden],#mods[hidden],#modpanel[hidden]{display:none!important}
#mods{display:flex;gap:4px;overflow-x:auto;padding:6px 8px;background:#fff;border-bottom:1px solid var(--line);max-width:100vw;-webkit-overflow-scrolling:touch}#mods button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 10px;font-size:14px;cursor:pointer;white-space:nowrap}#mods button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#modpanel{padding:10px;max-width:900px;margin:0 auto;padding-bottom:90px}#modpanel .card,#rbook .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}#modpanel .btns,#rbook .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}#flLinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.bkf{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin:6px 0}.bkf label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);min-width:0}.bkf input,.bkf select{font-size:16px;padding:6px;border:1px solid var(--line);border-radius:6px;min-width:0;width:100%}.okb{color:var(--ok);font-weight:700}
.nh{font-size:18px;margin:4px 0}.steps{display:flex;flex-wrap:wrap;gap:4px;font-size:12px;color:var(--mut);margin-bottom:6px}.steps span{border:1px solid var(--line);border-radius:10px;padding:2px 8px;background:#fff}.steps span.on{background:var(--pri);color:#fff}.newf h4{margin:12px 0 4px;font-size:14px}.chks{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px}.chks label{display:flex;align-items:center;gap:4px;min-height:32px}.newf .wide{width:100%;font-size:16px;padding:6px;border:1px solid var(--line);border-radius:6px;margin-top:4px}.bkf label.inl{flex-direction:row;align-items:center;gap:6px}.bnrow{display:grid;grid-template-columns:minmax(0,2fr) 64px minmax(0,2fr) 40px;gap:4px;margin:4px 0}.bnrow input{font-size:16px;padding:6px;border:1px solid var(--line);border-radius:6px;min-width:0}.rpick{display:block;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.rpick a{font-size:13px;margin-left:4px}.card.wait{background:#fff8e1;border-color:#ffe082}
#left{overflow:auto;border-right:1px solid var(--line);min-width:0}#mapwrap{position:relative;min-width:0}#map{position:absolute;inset:0}
.panel{display:none;padding:10px}.panel.on{display:block}
.fbox{margin-bottom:8px}.fbox summary{cursor:pointer;font-size:13px;color:var(--pri);padding:4px 0}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.filters input[type=search],.filters select{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;min-width:0}
.filters label{font-size:13px;display:flex;align-items:center;gap:4px}
.search{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:6px}
.addto{display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0 8px;flex-wrap:wrap}
.addto select{padding:5px;border-radius:6px;border:1px solid var(--line);max-width:100%}
.cnt{font-size:12px;color:var(--mut);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;min-width:0;overflow-wrap:anywhere}
.card h3{margin:0 0 4px;font-size:15px;cursor:pointer;color:#0b3d91}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.tag{font-size:11px;padding:1px 7px;border-radius:10px;background:#eef2f7;color:#425466;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag.rain{background:#e3f2fd;color:#0d47a1}.tag.rest{background:#fff3e0;color:#e65100}.tag.fest{background:#f3e5f5;color:#6a1b9a}.tag.ded{background:#e8f5e9;color:#1b5e20}.tag.near{background:#fffde7;color:#795548}.tag.ag{background:#fce4ec;color:#ad1457}.tag.ev{background:#ede7f6;color:#4527a0}
.agicon{background:#e91e63;border:2px solid #fff;border-radius:50%;width:24px;height:24px;line-height:20px;text-align:center;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.4)}.agicon.ev{background:#7b1fa2}
.train{font-size:12px;color:#00695c;margin:2px 0 4px 26px}
.desc{font-size:13px;color:#3e4c59;margin:4px 0}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn{border:1px solid var(--pri);color:var(--pri);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;justify-content:center}
.btn.pri{background:var(--pri);color:#fff}.btn.sm{padding:3px 8px;font-size:12px}.btn.warn{border-color:#c62828;color:#c62828}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.nav{border:1px dashed var(--line);border-radius:8px;padding:8px;margin-top:8px;background:#fbfcfd}
.nav h4{margin:0 0 6px;font-size:13px}.nav .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0}
.mc{font-family:ui-monospace,Menlo,monospace;background:#f1f3f5;padding:2px 6px;border-radius:6px;font-size:13px}
.todo{color:#c62828;font-weight:700}
.pk{border-top:1px solid var(--line);padding-top:6px;margin-top:6px}.pk:first-of-type{border-top:0;margin-top:0;padding-top:0}
.pkmeta{font-size:12px;color:var(--mut)}
.srrow{display:flex;gap:6px;margin:8px 0}.srrow input{flex:1 1 0;min-width:0;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:16px}.srrow select{min-height:40px;border-radius:8px;border:1px solid var(--line)}
.srin{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:16px;margin:4px 0}
.sr{border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;background:#fff}.sr .btn{margin-top:4px}.srmsg{min-height:1.2em;margin:6px 0}.srmsg.bad{color:#b71c1c}
.srmore{margin:8px 0}.sr.loc{border-color:#00897b;background:#f0faf8}.srzero{border:2px solid #f9a825;background:#fffde7;border-radius:10px;padding:10px;margin:8px 0}.srzero ul{margin:6px 0;padding-left:20px}.srzero li{margin:4px 0}
.srchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 10px;font-size:14px;min-height:34px}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}#srDay{font-size:16px;max-width:100%}
.btn.big{display:block;text-align:center;font-size:17px;padding:12px;margin:8px 0}#srPasteBox.hot{border:2px solid #1565c0;border-radius:10px;padding:8px;background:#f3f8ff}.srmore a{color:var(--pri);font-weight:600}.attrib{font-size:11px;color:var(--mut);margin-top:10px;line-height:1.5}.todo.mcpend{color:#c62828;font-weight:700}
.tag.cu{background:#e0f2f1;color:#00695c;font-weight:600}.card.custom{border-left:4px solid #00897b}
.cubar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
#cuform label{display:block;font-size:13px;margin:6px 0 2px;color:var(--mut)}#cuform input,#cuform select,#cuform textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:16px}
#cuform .err{color:#b71c1c;font-size:13px;min-height:1em;margin-top:6px}#cuform .hint{font-size:12px;color:var(--mut)}.mcsrc{font-size:11px;color:#8a99a8}.alts a{color:var(--rest)}
#swbar{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3000;background:#0d47a1;color:#fff;padding:8px 12px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.3);display:none;gap:8px;align-items:center;font-size:14px}#swbar.on{display:flex}#swbar span,#swbar button{white-space:nowrap}#swbar button{border:0;border-radius:6px;padding:5px 10px;background:#fff;color:#0d47a1;font-weight:700}
.days{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.days button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;line-height:1.3}
.days button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.dayhead{font-size:13px;color:var(--mut);margin:4px 0 8px}
.daynote{width:100%;min-height:38px;border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;font-size:13px;margin-bottom:8px;resize:vertical}
.it{display:flex;gap:6px;align-items:flex-start}.it .ord{flex:0 0 26px;height:26px;border-radius:13px;background:var(--spot);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.it.rest .ord{background:var(--rest)}.it .body{flex:1;min-width:0}
.tn{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}.tn input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:13px;min-width:0}.tn input[type=time]{flex:0 0 auto;width:110px}.tn input[type=text]{flex:1 1 140px}
.att{border:1px solid #ffe0b2;background:#fff8f0;border-radius:8px;padding:8px;margin-top:8px}.att .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0}.atth{font-size:14px}.atth b{cursor:pointer;color:#e65100}
.alert{color:#c62828;font-weight:700;font-size:13px;margin:4px 0}
.mergedicon{background:#1e88e5;border:3px solid #ef6c00;border-radius:50%;width:24px;height:24px;line-height:18px;text-align:center;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.drive{font-size:12px;color:#455a64;margin:2px 0 6px 32px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tools h4{flex:1 1 100%;margin:8px 0 0;font-size:13px;color:var(--mut)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;display:none;align-items:center;justify-content:center;padding:10px}
#modal.on{display:flex}#modal .box{background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:14px;position:relative}
#modal .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:28px;cursor:pointer;width:44px;height:44px}
table.info{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0;table-layout:fixed}table.info td{border-bottom:1px solid var(--line);padding:4px;vertical-align:top;overflow-wrap:anywhere}table.info td:first-child{white-space:nowrap;color:var(--mut);width:84px}
.src a{font-size:12px;word-break:break-all;display:block}
pre.json{background:#f4f6f8;border-radius:8px;padding:8px;font-size:11px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#263238;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;z-index:4000;display:none;max-width:90vw;text-align:center}
.legend{position:absolute;z-index:500;right:8px;top:8px;background:#fff;border-radius:8px;padding:6px 8px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.legend summary{cursor:pointer;font-weight:700;padding:2px 0}
.legend label{display:flex;align-items:center;gap:4px;cursor:pointer;padding:2px 0}.dot{width:10px;height:10px;border-radius:5px;display:inline-block}
#loading{padding:30px;text-align:center;color:var(--mut)}
#tripList{max-width:880px;margin:0 auto;padding:14px}
#tripList .card h3{font-size:17px}
#bnav{display:none}
@media (max-width:820px){
 body{padding-bottom:calc(62px + env(safe-area-inset-bottom))}
 header{padding:6px 8px;gap:6px}header h1{display:none}
 #tripSel{flex:1 1 0;width:0;min-width:0;max-width:none;font-size:15px;min-height:40px;text-overflow:ellipsis}
 .rsw{display:none}#routeSel{display:block;flex:0 0 auto;font-size:15px;min-height:40px}
 #rname{flex:1 1 100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 main{display:block;height:auto}#left{border:0;overflow:visible}
 .tabs{display:none}
 #mapwrap{display:none;position:fixed;left:0;right:0;top:var(--hh);bottom:calc(60px + env(safe-area-inset-bottom));z-index:900}
 #mapwrap.on{display:block}
 body.mapmode #left{display:none}
 #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:1500;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 8px rgba(0,0,0,.06)}
 #bnav button{flex:1;border:0;background:none;min-height:60px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
 #bnav button b{font-size:20px;font-weight:400;line-height:1}
 #bnav button.on{color:var(--pri);font-weight:700;background:#e8f0fe}
 .filters{grid-template-columns:1fr}
 .filters input[type=search],.filters select,.search,.addto select{font-size:16px;min-height:42px}
 .btn{min-height:42px;padding:8px 12px;font-size:14px}.btn.sm{min-height:38px;padding:6px 10px;font-size:13px}
 .days button{min-height:44px;padding:6px 10px}
 .tn input{font-size:16px;min-height:40px}

}
.leaflet-popup-content{font-size:13px}.leaflet-popup-content .btn{margin-top:4px}
#sentDlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}#sentDlg .sdBox{background:#fff;border-radius:12px;padding:16px;max-width:460px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3);border-top:6px solid #2e7d32}#sentDlg .wide,#autoUrl{width:100%;box-sizing:border-box}.bkSteps .bad{background:#c62828;color:#fff}
#doneDlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}#doneDlg .sdBox{background:#fff;border-radius:12px;padding:16px;max-width:460px;width:100%;border-top:6px solid #2e7d32}.btn.big{font-size:18px;padding:12px 18px;width:100%;min-height:48px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.sm{font-size:13px;padding:4px 10px}
.rcard{margin:8px 0;border:1px solid #ddd}.rcard.picked{border:2px solid #2e7d32}.rcard h4{margin:4px 0}.dsum summary{cursor:pointer;color:#1565c0;margin:4px 0}.bday{border-top:1px dashed #ccc;padding:6px 0}#build3{border-top:6px solid #1565c0}

<body>
<header id="hdr">
 <a class="home" href="../" title="回網站首頁（路線總覽地圖）">🗾</a>
 <h1 id="ttl">互動行程</h1>
 <select id="tripSel" aria-label="選擇行程"></select>
 <div class="rsw" id="rsw"></div>
 <select id="routeSel" aria-label="選擇路線"></select>
 <div id="rname"></div>
</header>
<div id="loading">載入中…</div>
<section id="tripList" hidden></section>
<nav id="mods" hidden><button data-m="new">➕新增旅遊規劃</button><button data-m="flights">✈️機票</button><button data-m="car">🚗租車</button><button data-m="lodging">🏨住宿</button><button data-m="route">🧭路線</button><button data-m="spots" class="on">📍景點</button><button data-m="rests">🍴餐廳</button><button data-m="daily">🗓每日</button></nav>
<section id="modpanel" hidden></section>
<main id="app" hidden>
 <section id="left">
  <div class="tabs" id="tabs">
   <button data-t="spots" class="on">景點</button><button data-t="rests">餐廳</button><button data-t="itin">每日行程</button>
  </div>
  <div class="panel on" id="p-spots">
   <input type="search" class="search" id="q" placeholder="搜尋名稱、介紹（例：紫陽花、溫泉、寶可夢）">
   <details class="fbox" id="fbox1"><summary>篩選（據點／類別／雨天）</summary>
   <div class="filters">
    <select id="fbase"></select>
    <select id="fcat"></select>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><label><input type="checkbox" id="frain">只看雨天可去</label><label><input type="checkbox" id="froute" checked>只看本路線</label></div>
   </div></details>
   <div class="cubar"><button class="btn pri" data-search="1" type="button">🔎 搜尋地點</button><button class="btn" id="cuadd">＋手動新增地點</button><button class="btn" id="cucopy">複製自訂地點清單</button></div>
   <div class="addto">加入行程到：<select class="dsel" id="dsel1"></select></div>
   <div class="cnt" id="scnt"></div><div id="slist"></div>
  </div>
  <div class="panel" id="p-rests">
   <details class="fbox" id="rbook"><summary>🍽 已訂好的餐廳訂位</summary><div id="rbookList"></div><div id="rbookForm"></div></details>
   <input type="search" class="search" id="rq" placeholder="搜尋餐廳、料理">
   <details class="fbox" id="fbox2"><summary>篩選（據點／餐別／類型）</summary>
   <div class="filters"><select id="rbase"></select>
   <select id="rmeal"><option value="">全部餐別</option><option value="breakfast">早餐</option><option value="lunch">午餐</option><option value="snack">甜點咖啡／小吃</option><option value="dinner">晚餐</option></select><select id="rcat"><option value="">全部類型</option></select>
   <label><input type="checkbox" id="rroute" checked>只看本路線</label></div></details>
   <div class="addto">加入行程到：<select class="dsel" id="dsel2"></select></div>
   <div class="cnt" id="rcnt"></div><div id="rlist"></div>
  </div>
  <div class="panel" id="p-itin">
   <div class="days" id="days"></div>
   <div class="dayhead" id="dayhead"></div>
   <textarea class="daynote" id="daynote" placeholder="本日備註（會一起匯出、寫進定案 final.json）"></textarea>
   <div id="ilist"></div>
   <div class="tools">

function crc32(u){let c=0xFFFFFFFF; for(let i=0;i<u.length;i++) c=CRC_T[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
 const u16=v=>[v&255,(v>>8)&255], u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
 files.forEach(f=>{const nm=enc.encode(f.name), data=typeof f.data==="string"?enc.encode(f.data):f.data, c=crc32(data);
  const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(data.length),...u32(data.length),...u16(nm.length),...u16(0)]);
  parts.push(lh,nm,data); cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(data.length),...u32(data.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
  off+=lh.length+nm.length+data.length;});
 const cs=cen.reduce((s,a)=>s+a.length,0); parts.push(...cen,new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cs),...u32(off),0,0]));
 return new Blob(parts,{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});}
function xesc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");}
function colName(i){let s=""; i++; while(i){const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26);} return s;}
function buildXlsx(rows){const W=[30,16,30,12,12,14,22,12,18,10,34,18,10,12,10,34];
 const cell=(v,r,c,st)=>{const ref=colName(c)+r; if(typeof v==="number"&&isFinite(v)) return `<c r="${ref}" s="${st?1:2}"><v>${v}</v></c>`; return v===""?`<c r="${ref}" s="${st?1:0}"/>`:`<c r="${ref}" t="inlineStr" s="${st?1:0}"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;};
 const sd=[XLSX_COLS].concat(rows).map((row,ri)=>`<row r="${ri+1}">${row.map((v,ci)=>cell(v,ri+1,ci,ri===0)).join("")}</row>`).join("");
 const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${W.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${sd}</sheetData><autoFilter ref="A1:${colName(XLSX_COLS.length-1)}${rows.length+1}"/></worksheet>`;
 const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFD9E1F2"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="3"><xf/><xf fontId="1" fillId="2" applyFont="1" applyFill="1"/><xf numFmtId="164" applyNumberFormat="1"/></cellXfs></styleSheet>`;
 return zipStore([
  {name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
  {name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
  {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="訂房資料" sheetId="1" r:id="rId1"/></sheets></workbook>`},
  {name:"xl/_rels/workbook.xml.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
  {name:"xl/styles.xml",data:styles},{name:"xl/worksheets/sheet1.xml",data:sheet}]);}

 const blob=buildXlsx(a.map(bkRow)), nm="訂房資料_"+(TID||"新行程")+".xlsx"; window.__lastXlsx=blob;
 const u=URL.createObjectURL(blob), el=document.createElement("a"); el.href=u; el.download=nm; document.body.appendChild(el); el.click(); setTimeout(()=>{URL.revokeObjectURL(u); el.remove();},800); toast("已匯出 "+a.length+" 筆訂房資料"); return blob;}

let LG_T=null, LG={vc:null,res:null};
function lgPoll(vc){clearTimeout(LG_T); LG.vc=vc; const st=$("#lgSt"); if(!st) return; if(!st.textContent) st.textContent="讀取判讀狀態中…";
 bkFetch("/api/status",{headers:{Authorization:"View "+vc}}).then(r=>{const el=$("#lgSt"); if(!el||LG.vc!==vc) return;
  if(r.status===404){el.textContent="找不到這個判讀代號（可能已超過 7 天被刪除）"; return;}
  if(!r.ok||!r.j){el.textContent="後台暫時連不上，稍後自動重試"; LG_T=setTimeout(()=>lgPoll(vc),20000); return;}
  el.textContent=(ST_TXT[r.j.status]||r.j.status).replace("路線已產生","判讀完成").replace("排路線中","判讀中").replace("自動排路線失敗","判讀失敗")+(r.j.error?"："+r.j.error:"");
  if(r.j.status==="published") return bkFetch("/api/result",{headers:{Authorization:"View "+vc}}).then(x=>{ if(x.ok&&x.j&&LG.vc===vc){LG.res=x.j; lgEditor((x.j.bookings||[]).map(b=>Object.assign({},b)),x.j.warnings||[]);} });
  if(r.j.status!=="failed"&&r.j.status!=="rejected") LG_T=setTimeout(()=>lgPoll(vc),5000);}).catch(()=>{LG_T=setTimeout(()=>lgPoll(vc),20000);});}
